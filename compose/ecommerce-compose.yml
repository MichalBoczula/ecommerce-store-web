name: ecommerce-web-local

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123!"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123!' -C -Q 'SELECT 1' -b >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval '
          try { rs.status(); }
          catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }); }
        '
        for attempt in {1..30}; do
          if [ "$$(mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'print(db.hello().isWritablePrimary)')" = true ]; then exit 0; fi
          sleep 2
        done
        exit 1

  products:
    image: mb0101/product-catalog-api@sha256:1814ef51bb86a2e34a4eff198c6fc1be31c9921b55fb4f5be12a02277b5e374d
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProductCatalogDb: "Server=sql;Database=ProductsDb;User Id=sa;Password=YourStrong@Password123!;TrustServerCertificate=True"
      Database__ApplyMigrations: "true"

  users:
    image: mb0101/ecommerce-store-users-api@sha256:2242777af2ada38dc9f98ef593f3a0670f04a400027d76e999660f92ce64300e
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      MongoDbSettings__DatabaseName: ecommerce-web-users

  invoice:
    image: mb0101/ecommerce-store-invoice-api@sha256:09b24ae59f362ca73f6f7e0369a0e0b0814d78b17b7d86403c5b4a24612e4df4
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      MongoDbSettings__DatabaseName: ecommerce-web-invoice
      ExternalServices__ProductCatalog__BaseUrl: http://products:8080
    shm_size: "2gb"

  payments:
    image: mb0101/ecommerce-store-payments-api@sha256:154d9900a42689ad84758f87b7f481257a4829835c51ebdcf48f34950f1a2c6b
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      invoice:
        condition: service_started
    environment:
      PAYMENTS_MONGODB_CONNECTION_STRING: mongodb://mongodb:27017/?replicaSet=rs0
      PAYMENTS_MONGODB_DATABASE_NAME: ecommerce-web-payments
      PAYMENTS_ORDERS_API_BASE_URL: http://invoice:8080

  bff:
    image: mb0101/ecommerce-store-bff-api@sha256:3ac990abd5926390f2267b74394f05106aa776756f73aadbe36d8fe30a9ed59d
    environment:
      ASPNETCORE_URLS: http://+:8080
      GatewaySettings__BaseUrl: http://bff:8080
      ReverseProxy__Clusters__products-cluster__Destinations__destination1__Address: http://products:8080
      ReverseProxy__Clusters__users-cluster__Destinations__destination1__Address: http://users:8080
      ReverseProxy__Clusters__orders-cluster__Destinations__destination1__Address: http://invoice:8080
      ReverseProxy__Clusters__payments-cluster__Destinations__destination1__Address: http://payments:8080
    ports:
      - "127.0.0.1:${BFF_PORT:-5137}:8080"
    depends_on:
      - products
      - users
      - invoice
      - payments

  web:
    image: ecommerce-store-web:local
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      - bff

volumes:
  sql-data:
  mongo-data:

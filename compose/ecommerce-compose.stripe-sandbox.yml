# Actual Stripe sandbox only; supply keys in a private environment or ignored env file.
services:
  payments:
    environment:
      PAYMENTS_STRIPE_ENABLED: "true"
      PAYMENTS_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set a Stripe sandbox secret key}
      PAYMENTS_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set the test endpoint signing secret}
      PAYMENTS_STRIPE_SUCCESS_URL: ${STRIPE_RETURN_BASE_URL:-http://localhost:4200}/orders?checkout=success
      PAYMENTS_STRIPE_CANCEL_URL: ${STRIPE_RETURN_BASE_URL:-http://localhost:4200}/orders?checkout=cancel

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check source and shell scripts
        run: bash scripts/ci.sh source
      - name: Verify pinned contracts and generated Kiota clients
        run: bash scripts/ci.sh contract
      - name: Audit dependencies (high and critical)
        run: bash scripts/ci.sh audit
      - name: Lint and build the Angular application
        run: bash scripts/ci.sh build

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Vitest and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            TestResults/unit.xml
            coverage/ecommerce-store-web/
          if-no-files-found: warn

  acceptance-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests on isolated containers
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-reports
          path: |
            TestResults/acceptance.xml
            TestResults/acceptance-compose.log
            TestResults/playwright-results/
            TestResults/playwright-html/
          if-no-files-found: warn

  quality-gate:
    if: always()
    needs: [build, unit-tests, acceptance-tests, secret-scan, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require each mandatory check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit-tests.result }}
          ACCEPTANCE: ${{ needs.acceptance-tests.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          for job in BUILD UNIT ACCEPTANCE SECRET_SCAN; do
            if [[ "${!job}" != success ]]; then
              echo "$job must succeed; actual result: ${!job}" >&2
              exit 1
            fi
          done
          expected=success
          if [[ "$EVENT_NAME" == push ]]; then expected=skipped; fi
          if [[ "$DEPENDENCY_REVIEW" != "$expected" ]]; then
            echo "Dependency Review must be $expected; actual result: $DEPENDENCY_REVIEW" >&2
            exit 1
          fi

  docker-image:
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build one local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ecommerce-store-web:ci
      - name: Smoke test SPA and static assets
        shell: bash
        run: bash scripts/smoke-image.sh ecommerce-store-web:ci
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-web:ci)"
          test -n "$image_id"
          echo "SCANNED_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          echo "Scanned image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-web
          sha_tag="$repository:$GITHUB_SHA"
          latest_tag="$repository:latest"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' ecommerce-store-web:ci)"
          docker tag ecommerce-store-web:ci "$sha_tag"
          docker tag ecommerce-store-web:ci "$latest_tag"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"
          docker push "$sha_tag" | tee "$RUNNER_TEMP/push-sha.log"
          docker push "$latest_tag" | tee "$RUNNER_TEMP/push-latest.log"
          sha_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-sha.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          test -n "$sha_digest"
          test "$sha_digest" = "$latest_digest"
          echo "Published $sha_tag and $latest_tag from image $SCANNED_IMAGE_ID with digest $sha_digest" >> "$GITHUB_STEP_SUMMARY"

<div class="cart-container">
    <div class="cart-header">
        <button mat-icon-button type="button" (click)="goBack()" aria-label="Go back">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h2>Shopping Cart</h2>
    </div>

    @if (cartLines().length > 0) {
    <div class="cart-layout">
        <table mat-table [dataSource]="cartLines()" class="mat-elevation-z2 cart-table">

            <ng-container matColumnDef="productId">
                <th mat-header-cell *matHeaderCellDef> Product ID </th>
                <td mat-cell *matCellDef="let item">{{ item.productId }}</td>
            </ng-container>

            <!-- Quantity Column -->
            <ng-container matColumnDef="quantity">
                <th mat-header-cell *matHeaderCellDef> Quantity </th>
                <td mat-cell *matCellDef="let item">
                    {{ item.quantity }}
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <!-- Order Summary Card -->
        <mat-card class="summary-card mat-elevation-z2">
            <mat-card-header>
                <mat-card-title>Order Summary</mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <div class="summary-row">
                    <span class="label">Total Items:</span>
                    <span class="value">{{ totalItems() }}</span>
                </div>

                <p>Product details and prices are currently unavailable.</p>
            </mat-card-content>

        </mat-card>
    </div>
    } @else {
    <div class="empty-cart mat-elevation-z1">
        <mat-icon class="empty-icon">shopping_cart</mat-icon>
        <p>Your shopping cart is empty.</p>
    </div>
    }
</div>

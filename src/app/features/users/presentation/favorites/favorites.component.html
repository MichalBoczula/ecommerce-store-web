<div class="favorites-container">
    <div class="favorites-header">
        <button mat-icon-button type="button" (click)="goBack()" aria-label="Go back">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h2>My Favorites</h2>
    </div>

    @if (favoriteItems().length > 0) {
    <div class="favorites-layout">
        <table mat-table [dataSource]="favoriteItems()" class="mat-elevation-z2 favorites-table">

            <ng-container matColumnDef="image">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let item">
                    <img src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Preview"
                        class="product-thumb" style="width: 48px; height: 48px; border-radius: 4px;" />
                </td>
            </ng-container>

            <ng-container matColumnDef="product">
                <th mat-header-cell *matHeaderCellDef> Product </th>
                <td mat-cell *matCellDef="let item">
                    <div style="display: flex; flex-direction: column;">
                        <span style="font-weight: 500;">{{ item.name }}</span>
                        @if (item.brand) {
                        <small style="color: #666;">{{ item.brand }}</small>
                        }
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef> Price </th>
                <td mat-cell *matCellDef="let item">
                    {{ item.priceAmount | currency:item.priceCurrency:'symbol':'1.2-2' }}
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> </th>
                <td mat-cell *matCellDef="let item" style="text-align: right;">
                    <button matButton="filled" class="fav-delete-btn" (click)="removeFavorite(item.productId)"
                        aria-label="Add to favorites">
                        <span class="material-symbols-outlined">favorite</span>
                    </button>

                    <button matButton="elevated" type="button" (click)="addToCart(item)"
                        aria-label="Add to shopping cart">
                        <span class="material-symbols-outlined">shopping_cart_checkout</span>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-card class="summary-card mat-elevation-z2">
            <mat-card-header>
                <mat-card-title>Wishlist Summary</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div class="summary-row">
                    <span class="label">Total Saved Items:</span>
                    <span class="value">{{ totalItems() }}</span>
                </div>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button color="warn" class="action-btn" (click)="clearAllFavorites()">
                    Clear All Favorites
                </button>
            </mat-card-actions>
        </mat-card>
    </div>
    } @else {
    <div class="empty-favorites mat-elevation-z1">
        <mat-icon class="empty-icon">favorite_border</mat-icon>
        <p>Your wishlist is empty.</p>
    </div>
    }
</div>

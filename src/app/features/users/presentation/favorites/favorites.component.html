<div class="favorites-container">
    <div class="favorites-header">
        <button mat-icon-button type="button" (click)="goBack()" aria-label="Go back">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h2>My Favorites</h2>
    </div>

    @if (favoritesList().length > 0) {
    <div class="favorites-layout">
        <table mat-table [dataSource]="favoritesList()" class="mat-elevation-z2 favorites-table">

            <!-- Product Id Column -->
            <ng-container matColumnDef="productId">
                <th mat-header-cell *matHeaderCellDef> Product Identifier </th>
                <td mat-cell *matCellDef="let item" class="product-id-cell">
                    <span class="product-id">{{ item.productId }}</span>
                </td>
            </ng-container>

            <!-- Added Date Column -->
            <ng-container matColumnDef="addedAt">
                <th mat-header-cell *matHeaderCellDef> Added Date </th>
                <td mat-cell *matCellDef="let item">
                    {{ item.addedAt | date:'mediumDate' }}
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> </th>
                <td mat-cell *matCellDef="let item" class="actions-cell">
                    <button mat-icon-button color="warn" (click)="removeFavorite(item.productId)"
                        aria-label="Remove favorite">
                        <mat-icon>favorite</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <!-- Summary Card -->
        <mat-card class="summary-card mat-elevation-z2">
            <mat-card-header>
                <mat-card-title>Wishlist Summary</mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <div class="summary-row">
                    <span class="label">Total Saved Items:</span>
                    <span class="value">{{ totalItems() }}</span>
                </div>
            </mat-card-content>

            <mat-card-actions>
                <button mat-button color="warn" class="action-btn" (click)="clearAllFavorites()">
                    Clear All Favorites
                </button>
            </mat-card-actions>
        </mat-card>
    </div>
    } @else {
    <div class="empty-favorites mat-elevation-z1">
        <mat-icon class="empty-icon">favorite_border</mat-icon>
        <p>Your wishlist is empty.</p>
    </div>
    }
</div>

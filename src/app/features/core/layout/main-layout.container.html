<a class="skip-link" href="#main-content">Skip to content</a>
<mat-sidenav-container class="shell">
  <mat-sidenav
    #filters
    id="catalog-filters"
    class="filter-drawer"
    mode="over"
    fixedInViewport
    role="dialog"
    aria-labelledby="filter-heading"
  >
    <div class="filter-heading">
      <h2 id="filter-heading">Filters</h2>
      <button mat-icon-button type="button" (click)="filters.close()" aria-label="Close filters">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <app-mobile-phone-filter (applied)="filters.close()" />
  </mat-sidenav>
  <mat-sidenav-content
    class="shell-content"
    [class.with-mobile-action]="layoutState.mobileActionBarVisible()"
  >
    <app-store-header
      [cartCount]="cartItemsCount()"
      [favoritesCount]="favoritesCount()"
      [filtersOpen]="filters.opened"
      (openFilters)="filters.open()"
    />
    <main id="main-content" tabindex="-1">
      @if (showCartError) {
        <div class="store-container notice notice-error" role="alert">
          <span>{{ cartError() }}</span>
          <a class="store-button" mat-button routerLink="/cart">View cart</a>
        </div>
      }
      @if (!customer.clientId()) {
        <div class="store-container notice" role="status">
          <span
            >No demo customer is selected. Choose an external ID in your profile to use the cart,
            favorites and orders.</span
          >
          <a class="store-button" mat-button routerLink="/profile">Open profile</a>
        </div>
      }
      <router-outlet />
    </main>
    <app-store-footer />
    <app-store-mobile-nav [cartCount]="cartItemsCount()" [favoritesCount]="favoritesCount()" />
  </mat-sidenav-content>
</mat-sidenav-container>

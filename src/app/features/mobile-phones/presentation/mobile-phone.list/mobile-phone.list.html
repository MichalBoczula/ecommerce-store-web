<article class="grid-list">
    @if (phones().length > 0) {
    @for (phone of phones(); track phone.id) {
    <section class="container">
        <div class="image">
            <img src="https://material.angular.dev/assets/img/examples/shiba2.jpg" [alt]="phone.name" />
        </div>

        <div class="content-container">
            <button type="button" class="content" (click)="openDetails(phone.id)"
                [attr.aria-label]="'View details for ' + phone.name">
                <span class="phone-name">{{ phone.name ?? 'Unknown model' }}</span>

                @if (phone.screenSizeInches) {
                <div class="content-line">
                    <p class="content-title">Screen size:</p>
                    <p class="content-specific">{{ phone.screenSizeInches }}''</p>
                </div>
                }

                @if (phone.camera) {
                <div class="content-line">
                    <p class="content-title">Camera:</p>
                    <p class="content-specific">{{ phone.camera }}</p>
                </div>
                }

                @if (phone.displayType) {
                <div class="content-line">
                    <p class="content-title">Processor:</p>
                    <p class="content-specific">{{ phone.displayType }}</p>
                </div>
                }
            </button>

            <div class="sub-content">
                <div class="price">
                    {{ phone.price?.amount }} {{ phone.price?.currency }}
                </div>

                <div class="button-container">
                    <button matButton="filled" [class.fav-delete-btn]="phone.isFavorite"
                        (click)="toggleFavorite(phone, $event)" [disabled]="!selectedClientId()" aria-label="Add to favorites">
                        <span class="material-symbols-outlined">favorite</span>
                    </button>

                    <button matButton="elevated" color="primary" type="button" (click)="addToCart(phone, $event)"
                        [disabled]="!selectedClientId()">
                        <span class="material-symbols-outlined">shopping_cart_checkout</span>
                    </button>
                </div>
            </div>
        </div>
    </section>
    }
    } @else {
    <h1>Loading...</h1>
    }
</article>

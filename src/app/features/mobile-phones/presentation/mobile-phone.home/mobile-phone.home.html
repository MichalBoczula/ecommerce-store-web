<article class="grid-list">
    @if (top$ | async; as phones) {
    @for (phone of phones; track phone.id) {
    <section class="container">
        <div class="image">
            @if (phone.commonDescription?.mainPhoto; as mainPhoto) {
            <img [src]="mainPhoto" [alt]="phone.commonDescription?.name ?? 'Mobile phone'" decoding="async" />
            } @else {
            <span role="img" [attr.aria-label]="'Photo unavailable for ' + (phone.commonDescription?.name ?? 'mobile phone')">
                <mat-icon aria-hidden="true">smartphone</mat-icon>
            </span>
            }
        </div>
        <div class="phone-name-container">
            <h4>{{phone.commonDescription!.name}}</h4>
            <h4>price: {{phone.price!.amount}}$</h4>
        </div>
    </section>
    }
    }
</article>
<article class="grid-list">
    <button matFab extended routerLink="/list" class="home-btn">
        <mat-icon>home</mat-icon>
        Check more ...
    </button>
</article>
